[project]
name = "wealthsimple-community-intel"
version = "0.1.0"
description = "Community intelligence platform for Wealthsimple — aggregates Reddit + App Store feedback into actionable product insights"
requires-python = ">=3.11"
dependencies = [
    # Data collection
    "praw>=7.7.1",
    "google-play-scraper>=1.2.4",
    "app-store-web-scraper>=0.2.0",
    # Data processing
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "langdetect>=1.0.9",
    # ML / NLP
    "bertopic>=0.16.0",
    "transformers>=4.35.0",
    "torch>=2.0.0",
    "sentence-transformers>=2.2.2",
    "scikit-learn>=1.3.0",
    "hdbscan>=0.8.33",
    "umap-learn>=0.5.4",
    # Gemini API (free tier: 1,500 req/day — https://aistudio.google.com)
    "google-genai>=1.0.0",
    # Dashboard
    "streamlit>=1.28.0",
    "plotly>=5.17.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "loguru>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
collect = "pipeline.collect_reddit:run"
run-pipeline = "pipeline.run_pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "ui"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default arg
    "SIM117", # nested with
]

[tool.ruff.lint.per-file-ignores]
"ui/app.py" = ["E402"]  # module-level imports not at top (Streamlit pattern)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

# ── uv ───────────────────────────────────────────────────────────────────────
[tool.uv]
dev-dependencies = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]
